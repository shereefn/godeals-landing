<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deals in Your City</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 30%, #48c355 0%, #2fa33b 50%, #1c7c27 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
      color: #ffffff;
    }

    /* Main Content Area - Centered */
    .hero-content {
      width: 100%;
      max-width: 1100px;
      padding: 20px;
      flex: 1; /* Takes up available space to center vertically */
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      z-index: 2;
    }

    /* Responsive Headline */
    .headline {
      font-size: clamp(1.75rem, 5vw, 3.25rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.2;
      text-shadow: 0 3px 12px rgba(0, 0, 0, 0.15);
      margin-bottom: 28px;
      max-width: 90vw;
    }

    /* Clean Matching Selectors */
    .selectors-row {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
    }

    .select-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.96);
      border-radius: 999px;
      box-shadow: 0 8px 24px -4px rgba(0, 0, 0, 0.16),
                  0 2px 6px rgba(0, 0, 0, 0.08);
      padding: 4px 18px 4px 16px;
      transition: all 0.2s ease;
      width: 100%;
      max-width: 260px; /* Keeps them uniform on mobile */
    }

    .select-wrapper:hover,
    .select-wrapper:focus-within {
      background: #ffffff;
      transform: translateY(-2px);
      box-shadow: 0 12px 28px -4px rgba(0, 0, 0, 0.22);
    }

    .flag-icon {
      font-size: 1.35rem;
      margin-right: 10px;
      line-height: 1;
      display: flex;
      align-items: center;
    }

    .city-pin-icon {
      margin-right: 8px;
      display: flex;
      align-items: center;
      color: #1c7c27;
    }

    select {
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
      background: transparent;
      border: none;
      outline: none;
      font-family: inherit;
      font-size: 1.05rem;
      font-weight: 700;
      color: #1e293b;
      padding: 10px 24px 10px 0;
      cursor: pointer;
      width: 100%;
    }

    /* Custom dropdown arrow */
    .dropdown-arrow {
      position: absolute;
      right: 16px;
      pointer-events: none;
      display: flex;
      align-items: center;
      color: #64748b;
    }

    /* Cityscape Drawing at Bottom */
    .city-illustration-wrap {
      width: 100%;
      line-height: 0;
      z-index: 1;
    }

    .city-illustration-wrap svg {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>

  <!-- Top Hero Section -->
  <main class="hero-content">
    <h1 class="headline">Get the best deals in your city!</h1>

    <div class="selectors-row">
      <!-- Country Dropdown -->
      <div class="select-wrapper">
        <span class="flag-icon">🇸🇦</span>
        <select id="country-select" aria-label="Select Country">
          <option value="SA" selected>Saudi Arabia</option>
        </select>
        <span class="dropdown-arrow">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </span>
      </div>

      <!-- City Dropdown -->
      <div class="select-wrapper">
        <span class="city-pin-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
            <circle cx="12" cy="10" r="3"></circle>
          </svg>
        </span>
        <select id="city-select" aria-label="Select City">
          <option value="" disabled selected>Choose city...</option>
          <option value="riyadh">Riyadh</option>
        </select>
        <span class="dropdown-arrow">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </span>
      </div>
    </div>
  </main>

  <!-- Vector Illustration: Town, Skyline, Road, Cars, Trees & People -->
  <div class="city-illustration-wrap">
    <svg viewBox="0 0 1440 400" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Sky tint background glow -->
      <path d="M0 240Q720 180 1440 240V400H0Z" fill="#248a31" opacity="0.3"/>

      <!-- Distant City Skyline Silhouettes -->
      <rect x="120" y="140" width="70" height="140" rx="3" fill="#1b6324" opacity="0.5"/>
      <rect x="200" y="100" width="85" height="180" rx="3" fill="#17561f" opacity="0.55"/>
      <polygon points="242,50 200,100 285,100" fill="#17561f" opacity="0.55"/>
      <rect x="300" y="160" width="60" height="120" rx="3" fill="#1b6324" opacity="0.5"/>
      
      <rect x="1060" y="130" width="90" height="150" rx="3" fill="#17561f" opacity="0.5"/>
      <polygon points="1105,70 1060,130 1150,130" fill="#17561f" opacity="0.5"/>
      <rect x="1160" y="160" width="75" height="120" rx="3" fill="#1b6324" opacity="0.55"/>
      <rect x="1250" y="110" width="80" height="170" rx="3" fill="#17561f" opacity="0.5"/>

      <!-- Midground Buildings -->
      <rect x="420" y="180" width="110" height="100" rx="4" fill="#ffffff" opacity="0.95"/>
      <polygon points="415,180 475,130 535,180" fill="#f87171"/>
      <rect x="440" y="200" width="22" height="22" rx="2" fill="#93c5fd"/>
      <rect x="480" y="200" width="22" height="22" rx="2" fill="#93c5fd"/>
      <rect x="465" y="240" width="24" height="40" rx="2" fill="#475569"/>

      <rect x="560" y="150" width="130" height="130" rx="4" fill="#f1f5f9"/>
      <rect x="580" y="170" width="22" height="25" rx="2" fill="#fde047"/>
      <rect x="620" y="170" width="22" height="25" rx="2" fill="#fde047"/>
      <rect x="660" y="170" width="22" height="25" rx="2" fill="#93c5fd"/>
      <rect x="580" y="210" width="22" height="25" rx="2" fill="#93c5fd"/>
      <rect x="620" y="210" width="22" height="25" rx="2" fill="#fde047"/>
      <rect x="660" y="210" width="22" height="25" rx="2" fill="#93c5fd"/>

      <rect x="710" y="190" width="100" height="90" rx="4" fill="#fed7aa"/>
      <polygon points="705,190 760,145 815,190" fill="#ea580c"/>
      <rect x="730" y="210" width="20" height="20" rx="2" fill="#ffffff"/>
      <rect x="770" y="210" width="20" height="20" rx="2" fill="#ffffff"/>

      <rect x="830" y="160" width="120" height="120" rx="4" fill="#ffffff"/>
      <rect x="850" y="180" width="24" height="24" rx="2" fill="#93c5fd"/>
      <rect x="890" y="180" width="24" height="24" rx="2" fill="#93c5fd"/>
      <rect x="850" y="220" width="24" height="24" rx="2" fill="#93c5fd"/>
      <rect x="890" y="220" width="24" height="24" rx="2" fill="#93c5fd"/>

      <!-- Trees -->
      <g>
        <rect x="385" y="245" width="8" height="35" fill="#78350f"/>
        <circle cx="389" cy="235" r="22" fill="#15803d"/>
        <rect x="540" y="250" width="7" height="30" fill="#78350f"/>
        <circle cx="543" cy="242" r="18" fill="#16a34a"/>
        <rect x="965" y="245" width="8" height="35" fill="#78350f"/>
        <circle cx="969" cy="235" r="20" fill="#15803d"/>
      </g>

      <!-- Pedestrians / People Walking -->
      <g transform="translate(320, 240)">
        <!-- Person 1 -->
        <circle cx="10" cy="8" r="5" fill="#fcd34d"/>
        <path d="M10 13V28M10 28L6 40M10 28L14 40M6 18L14 18" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
        <!-- Shopping Bag -->
        <rect x="15" y="20" width="6" height="8" rx="1" fill="#ef4444"/>
      </g>

      <g transform="translate(1010, 242)">
        <!-- Person 2 -->
        <circle cx="8" cy="8" r="5" fill="#fbcfe8"/>
        <path d="M8 13V26M8 26L4 38M8 26L12 38M4 17L12 17" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
      </g>

      <!-- Pavement / Sidewalk -->
      <rect x="0" y="278" width="1440" height="12" fill="#cbd5e1"/>
      <line x1="0" y1="278" x2="1440" y2="278" stroke="#94a3b8" stroke-width="2"/>

      <!-- Main Roadway -->
      <rect x="0" y="290" width="1440" height="110" fill="#334155"/>
      <!-- Dashed White Lane Lines -->
      <line x1="0" y1="345" x2="1440" y2="345" stroke="#f8fafc" stroke-width="4" stroke-dasharray="35 25"/>

      <!-- Cars Driving -->
      <!-- Red Car Left-to-Right -->
      <g transform="translate(180, 305)">
        <path d="M10 32L24 16H66L82 32H94C97 32 100 35 100 38V44C100 46 98 48 96 48H4C2 48 0 46 0 44V38C0 35 3 32 6 32H10Z" fill="#ef4444"/>
        <!-- Car Windows -->
        <path d="M26 30L34 18H48V30H26Z" fill="#bfdbfe"/>
        <path d="M52 18H64L76 30H52V18Z" fill="#bfdbfe"/>
        <!-- Wheels -->
        <circle cx="24" cy="48" r="9" fill="#0f172a"/>
        <circle cx="24" cy="48" r="4" fill="#cbd5e1"/>
        <circle cx="76" cy="48" r="9" fill="#0f172a"/>
        <circle cx="76" cy="48" r="4" fill="#cbd5e1"/>
      </g>

      <!-- Blue Sedan Right-to-Left -->
      <g transform="translate(760, 315)">
        <path d="M12 28L28 12H72L90 28H102C105 28 108 31 108 34V40C108 42 106 44 104 44H4C2 44 0 42 0 40V34C0 31 3 28 6 28H12Z" fill="#2563eb"/>
        <!-- Windows -->
        <path d="M30 26L38 15H52V26H30Z" fill="#e0f2fe"/>
        <path d="M56 15H68L80 26H56V15Z" fill="#e0f2fe"/>
        <!-- Wheels -->
        <circle cx="26" cy="44" r="9" fill="#0f172a"/>
        <circle cx="26" cy="44" r="4" fill="#cbd5e1"/>
        <circle cx="82" cy="44" r="9" fill="#0f172a"/>
        <circle cx="82" cy="44" r="4" fill="#cbd5e1"/>
      </g>

      <!-- Yellow Cab / Delivery Van -->
      <g transform="translate(1200, 300)">
        <path d="M5 35H110V18C110 14 106 10 102 10H50L30 35H5Z" fill="#eab308"/>
        <path d="M52 14H95V30H38L52 14Z" fill="#fef08a"/>
        <circle cx="32" cy="45" r="9" fill="#0f172a"/>
        <circle cx="32" cy="45" r="4" fill="#cbd5e1"/>
        <circle cx="88" cy="45" r="9" fill="#0f172a"/>
        <circle cx="88" cy="45" r="4" fill="#cbd5e1"/>
      </g>
    </svg>
  </div>

<script>
    // Trigger redirect to subdomain when a user selects a city
    const citySelect = document.getElementById('city-select');
    citySelect.addEventListener('change', (e) => {
      const city = e.target.value;
      
      // Ensure a valid city is selected (not the placeholder)
      if (city) {
        // Redirects to https://riyadh.godeals.me
        window.location.href = `https://${city}.godeals.me`; 
      }
    });
  </script>
</body>
</html>
